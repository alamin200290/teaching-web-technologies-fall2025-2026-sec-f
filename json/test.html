<!DOCTYPE html>
<html lang="en">
<head>
    <title>JSON Example</title>
</head>
<body>
        <h1 id="head"> JSON Exmaple </h1>
        <form>
            Username: <input type="text" id="username" name="Username" value=""/>
            <input type="button" name="submit" value="submit" onclick="ajax()" /> 
            <input type="button" name="click" value="click" onclick="alert('testing task 2')" />
        </form> 


        <script>
            function ajax(){
                let username = document.getElementById('username').value;
                let password = '12';
                let email = 'alamin@aiub.edu';

                let user = {
                    "username": username,
                    "password": password,
                    "email": email
                }

                let data = JSON.stringify(user);
  
                let xhttp = new XMLHttpRequest();
                //xhttp.open('GET', 'upload.php?username='+Username, true);
                xhttp.open('POST', 'upload.php', true);
                xhttp.setRequestHeader('Content-type', 'application/x-www-form-urlencoded');
                xhttp.send('user='+data);
                xhttp.onreadystatechange = function (){
                    if(this.readyState == 4 && this.status == 200){
                        //alert(this.responseText);
                        let user = JSON.parse(this.responseText);
                        document.getElementById('head').innerHTML = user.email;
                    }
                }
            }
        </script>
</body>
</html>
